name: Verify and publish DineFlow
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dineflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: target/surefire-reports/
      - name: Create release checksum
        if: matrix.os == 'ubuntu-24.04'
        run: cd target && sha256sum dineflow.jar > dineflow.jar.sha256
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: dineflow-jar
          path: |
            target/dineflow.jar
            target/dineflow.jar.sha256
  site:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - uses: actions/deploy-pages@v4
        id: deploy
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dineflow-jar
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            DineFlow desktop portfolio demo. Requires Java 17 or newer.
            Download dineflow.jar and run: java -jar dineflow.jar
            Embedded H2 storage is created under ./data. No MySQL server is needed.
            This is a local demonstration application, without authentication or payment processing.
          files: |
            release/dineflow.jar
            release/dineflow.jar.sha256
